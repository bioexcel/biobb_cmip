name: tests containers

on:
  # workflow_dispatch
  push:
    branches: [ master ]
    paths-ignore:
      - '.gitignore'
      - '.readthedocs.yaml'
      - 'LICENSE'
      - 'setup.py'
      - 'README.md'
      - 'CITATION.cff'
      - 'references.jsonld'
      - '**/docs/**'
      - '**/json_schemas/**'
      - '.github/workflows/pr-tests.yml'
      - '**/test/data/**'
      - '**/test/references/**'
      - '.github/workflows/linting_and_testing.yml'

jobs:
  test_containers:
    uses: bioexcel/biobb/.github/workflows/test_containers.yml@master
    with:
      extra-packages: "mdanalysis>=2.0.0 biobb_structure_checking==3.15.6"
      setup-script: |
        sed -i "s|path_to_vdwprm|$GITHUB_WORKSPACE/biobb_cmip/cmip/dat/vdwprm|g" biobb_cmip/test/conf.yml
        # CMIP titration allocates a 24 GB array but uses less than 4 GB: the kernel refuses
        # the allocation on the 16 GB runners ("ERROR when trying to allocate") unless it can overcommit
        sudo sysctl -w vm.overcommit_memory=1
